[project]
name = "microgpt-alchemy-workshop"
version = "0.1.0"
description = "Train a tiny language model on movie reviews, and see whether it learns sentiment without labels"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "chz>=0.4,<0.5",
    "datasets>=5.1",
    "matplotlib>=3.11",
    "numpy>=2.5",
    "regex>=2024",
    "rich>=15",
    "safetensors>=0.4",
    "scikit-learn>=1.5",
    "threadpoolctl>=3",
    "torch>=2.14",
]

[dependency-groups]
dev = ["pytest>=9"]

[tool.uv]
package = false  # a workshop, run from this folder: nothing to build or install

# On Linux, torch from PyTorch's CPU-only index (PyPI's Linux build bundles CUDA, gigabytes we do not need)
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
