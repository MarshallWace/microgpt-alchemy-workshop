<svg xmlns="http://www.w3.org/2000/svg" width="740" height="176" viewBox="0 0 740 176" font-family="Lato, Calibri, Segoe UI, Arial, sans-serif"><style>@media (prefers-color-scheme: dark) {.ink {fill: #ececec}.box {fill: #3e2a4a}.boxg {fill: #333333}.boxa {fill: #5c3a70}}</style><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a152c2"/></marker></defs>
<rect x="20.0" y="30.0" width="220.0" height="44.0" rx="8" class="boxg" fill="#e9e9e9"/>
<text x="130.0" y="57.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle">0 … 255: one per byte</text>
<rect x="244.0" y="30.0" width="380.0" height="44.0" rx="8" class="box" fill="#efe3f5"/>
<text x="434.0" y="57.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle">256, 257, …: one per merge, in learned order</text>
<rect x="628.0" y="30.0" width="92.0" height="44.0" rx="8" class="boxa" fill="#dcc1ea"/>
<text x="674.0" y="57.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle" font-family="Roboto Mono, Consolas, monospace">&lt;bos&gt;</text>
<text x="20.0" y="20.0" font-size="12" fill="#8a8a8a" text-anchor="start">token ids</text>
<text x="720.0" y="20.0" font-size="12" fill="#8a8a8a" text-anchor="end">vocab_size tokens</text>
<text x="20.0" y="112.0" font-size="13" class="ink" fill="#1a1a1a" text-anchor="start" font-weight="700">tokenizer.json</text>
<text x="20.0" y="136.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="start" font-family="Roboto Mono, Consolas, monospace">{&quot;merges&quot;: [[116, 104], [256, 101], ...]}</text>
<text x="20.0" y="160.0" font-size="12" fill="#8a8a8a" text-anchor="start">merge 0: token 116 (t) + token 104 (h) = token 256 (th);  merge 1: 256 (th) + 101 (e) = 257 (the)</text>
</svg>
