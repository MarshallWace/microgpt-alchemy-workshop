<svg xmlns="http://www.w3.org/2000/svg" width="720" height="312" viewBox="0 0 720 312" font-family="Lato, Calibri, Segoe UI, Arial, sans-serif"><style>@media (prefers-color-scheme: dark) {.ink {fill: #ececec}.box {fill: #3e2a4a}.boxg {fill: #333333}.boxa {fill: #5c3a70}}</style><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a152c2"/></marker></defs>
<text x="20.0" y="42.0" font-size="15" fill="#a152c2" text-anchor="start" font-weight="700">1</text>
<text x="40.0" y="42.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="start">the SAE layer&#x27;s output, at every position</text>
<text x="40.0" y="59.0" font-size="12" fill="#8a8a8a" text-anchor="start">the model runs as usual up to here</text>
<rect x="340.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#a961c7"/>
<rect x="349.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#e3cced"/>
<rect x="358.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#c28fd7"/>
<rect x="367.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#ba80d2"/>
<rect x="376.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#ebdbf2"/>
<rect x="385.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#ca9edd"/>
<rect x="394.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#dbbde8"/>
<rect x="403.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#b270cd"/>
<rect x="412.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#d3ade2"/>
<rect x="421.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#a152c2"/>
<rect x="430.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#e3cced"/>
<rect x="439.0" y="28.0" width="7.0" height="22.0" rx="2" fill="#c28fd7"/>
<path d="M394 52 V67.0" stroke="#8a8a8a" stroke-width="2"/>
<path d="M415 67.0 H605" stroke="#8a8a8a" stroke-width="2"/>
<line x1="415.0" y1="67.0" x2="415.0" y2="82.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<line x1="605.0" y1="67.0" x2="605.0" y2="82.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<text x="20.0" y="102.0" font-size="15" fill="#a152c2" text-anchor="start" font-weight="700">2</text>
<text x="40.0" y="102.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="start">encode it, and keep the error</text>
<text x="40.0" y="119.0" font-size="12" fill="#8a8a8a" text-anchor="start">error = activation − reconstruction</text>
<rect x="340.0" y="84.0" width="150.0" height="36.0" rx="8" class="box" fill="#efe3f5"/><text x="415.0" y="106.9" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle">features</text>
<rect x="510.0" y="84.0" width="190.0" height="36.0" rx="8" class="boxg" fill="#e9e9e9"/><text x="605.0" y="106.5" font-size="13" class="ink" fill="#1a1a1a" text-anchor="middle">error (what the SAE misses)</text>
<text x="20.0" y="162.0" font-size="15" fill="#a152c2" text-anchor="start" font-weight="700">3</text>
<text x="40.0" y="162.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="start">set one feature</text>
<text x="40.0" y="179.0" font-size="12" fill="#8a8a8a" text-anchor="start">e.g. #904 to 1 × its largest activation</text>
<rect x="340.0" y="144.0" width="150.0" height="36.0" rx="8" class="box" fill="#efe3f5"/><text x="415.0" y="166.9" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle">#904 = 1 × max</text>
<line x1="415.0" y1="122.0" x2="415.0" y2="142.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<text x="20.0" y="222.0" font-size="15" fill="#a152c2" text-anchor="start" font-weight="700">4</text>
<text x="40.0" y="222.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="start">decode, and add the error back</text>
<text x="40.0" y="239.0" font-size="12" fill="#8a8a8a" text-anchor="start">only the clamped feature changes</text>
<rect x="340.0" y="204.0" width="360.0" height="36.0" rx="8" class="box" fill="#efe3f5"/><text x="520.0" y="226.9" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle">decoder(features) + error</text>
<line x1="415.0" y1="182.0" x2="415.0" y2="202.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<line x1="605.0" y1="122.0" x2="605.0" y2="202.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<text x="20.0" y="282.0" font-size="15" fill="#a152c2" text-anchor="start" font-weight="700">5</text>
<text x="40.0" y="282.0" font-size="14" class="ink" fill="#1a1a1a" text-anchor="start">the rest of the model continues</text>
<text x="40.0" y="299.0" font-size="12" fill="#8a8a8a" text-anchor="start">the next token now leans positive</text>
<line x1="520.0" y1="242.0" x2="520.0" y2="262.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<rect x="340.0" y="264.0" width="360.0" height="36.0" rx="8" class="boxg" fill="#e9e9e9"/><text x="520.0" y="286.9" font-size="14" class="ink" fill="#1a1a1a" text-anchor="middle">the later layers → next token → repeat</text>
</svg>
