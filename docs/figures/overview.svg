<line x1="160.0" y1="454.0" x2="160.0" y2="476.0" stroke="#8a8a8a" stroke-width="2" marker-end="url(#g)"/>
<text x="160.0" y="500.0" font-size="16" class="ink" fill="#1a1a1a" text-anchor="middle">scores for the next character</text>
