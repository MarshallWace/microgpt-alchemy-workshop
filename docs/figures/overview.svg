<svg xmlns="http://www.w3.org/2000/svg" width="680" height="520" viewBox="0 0 680 520" font-family="Lato, Calibri, Segoe UI, Arial, sans-serif"><style>@media (prefers-color-scheme: dark) {.ink {fill: #ececec}.box {fill: #3e2a4a}.boxg {fill: #333333}.grid {stroke: #333333}}</style><defs><marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#a152c2"/></marker></defs>
<rect x="110.0" y="10.0" width="100.0" height="40.0" rx="6" class="box" fill="#efe3f5"/><text x="160.0" y="36.3" font-size="18" fill="#a152c2" text-anchor="middle" font-family="Roboto Mono, Consolas, monospace">&quot;good&quot;</text>
<rect x="50.0" y="74.0" width="220.0" height="50.0" rx="8" class="box" fill="#efe3f5"/><text x="160.0" y="105.3" font-size="18" class="ink" fill="#1a1a1a" text-anchor="middle">tokenizer</text>
<text x="300.0" y="105.0" font-size="16" fill="#8a8a8a" text-anchor="start">text → numbers</text>
<rect x="50.0" y="154.0" width="220.0" height="50.0" rx="8" class="box" fill="#efe3f5"/><text x="160.0" y="185.3" font-size="18" class="ink" fill="#1a1a1a" text-anchor="middle">embeddings</text>
<text x="300.0" y="185.0" font-size="16" fill="#8a8a8a" text-anchor="start">numbers → vectors that can carry meaning</text>
<rect x="36.0" y="234.0" width="248.0" height="150.0" rx="8" fill="none" stroke="#a152c2" stroke-width="2"/>
<text x="160.0" y="256.0" font-size="15" fill="#a152c2" text-anchor="middle" font-weight="700">transformer block × layers</text>
<rect x="50.0" y="266.0" width="220.0" height="46.0" rx="8" class="box" fill="#efe3f5"/><text x="160.0" y="295.3" font-size="18" class="ink" fill="#1a1a1a" text-anchor="middle">attention</text>
<text x="300.0" y="295.0" font-size="16" fill="#8a8a8a" text-anchor="start">each character looks at the earlier ones</text>
<rect x="50.0" y="324.0" width="220.0" height="46.0" rx="8" class="box" fill="#efe3f5"/><text x="160.0" y="353.3" font-size="18" class="ink" fill="#1a1a1a" text-anchor="middle">MLP</text>
<text x="300.0" y="353.0" font-size="16" fill="#8a8a8a" text-anchor="start">each character is processed on its own</text>
<rect x="50.0" y="404.0" width="220.0" height="50.0" rx="8" class="box" fill="#efe3f5"/><text x="160.0" y="435.3" font-size="18" class="ink" fill="#1a1a1a" text-anchor="middle">output layer</text>
<text x="300.0" y="435.0" font-size="16" fill="#8a8a8a" text-anchor="start">a score for every possible next character</text>
